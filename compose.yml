services:
  mysql:
    image: mysql:8.4
    container_name: sleep-pattern-mysql
    environment:
      MYSQL_DATABASE: sleep_pattern_db
      MYSQL_USER: sleep_app
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD in your environment}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your environment}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - sleep-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build: .
    container_name: sleep-pattern-api
    ports:
      - "8000:8000"
    environment:
      SLEEP_DATABASE_URL: ${SLEEP_DATABASE_URL:?Set SLEEP_DATABASE_URL in your environment}
    depends_on:
      mysql:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: sleep-pattern-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml

volumes:
  sleep-mysql-data: