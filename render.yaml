services:
  - type: web
    name: sleep-pattern-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: SLEEP_DATABASE_URL
        sync: false
      - key: FRONTEND_URLS
        sync: false
